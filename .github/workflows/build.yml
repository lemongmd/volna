name: Сборка для Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Зависимости
        run: npm ci

      - name: Проверка фронтенда
        run: npm run check

      - name: Сборка приложения и установщика
        run: npx tauri build

      - name: Установщик (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Volna-Setup-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Портативная версия (без установки)
        uses: actions/upload-artifact@v4
        with:
          name: Volna-Portable-Windows
          path: src-tauri/target/release/Volna.exe
          if-no-files-found: error

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
