name: Сборка для Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Версия релиза, например v0.1.0 (пусто — просто сборка)'
        required: false
        default: ''

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Зависимости
        run: npm ci

      - name: Проверка фронтенда
        run: npm run check

      - name: Сборка приложения и установщика
        run: npx tauri build

      - name: Установщик (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Volna-Setup-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Портативная версия (без установки)
        uses: actions/upload-artifact@v4
        with:
          name: Volna-Portable-Windows
          path: src-tauri/target/release/Volna.exe
          if-no-files-found: error

      - name: Портативный файл для релиза
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: Copy-Item src-tauri/target/release/Volna.exe "Volna-${{ env.RELEASE_TAG }}-portable.exe"

      - name: Релиз (тег v* или ручной запуск с версией)
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Волна ${{ env.RELEASE_TAG }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Volna-${{ env.RELEASE_TAG }}-portable.exe
